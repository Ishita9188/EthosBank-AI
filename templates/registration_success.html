{% load static %}
<!DOCTYPE html>
<html>
<head>

    <title>Registration Successful</title>

    <link rel="stylesheet"
          href="{% static 'css/register_success.css' %}">

</head>

<body>

<div class="overlay">

    <div class="modal">

        <div class="success-icon">
            ✓
        </div>

        <h2>
            Registration Successful
        </h2>

        <p>
            Your EthosBank AI account has been created.
        </p>

        <div class="details">

            <div class="detail-box">

                <label>Customer ID</label>

                <h3>
                    {{ customer_id }}
                </h3>

            </div>

            <div class="detail-box">

                <label>Account Number</label>

                <h3>
                    {{ account_number }}
                </h3>

            </div>

        </div>

        <div class="note">

            Please save these details for future login.

        </div>

        <a href="{% url 'login' %}"
           class="login-btn">

            Proceed To Login

        </a>

    </div>

</div>

</body>
</html>
